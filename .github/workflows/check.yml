name: Check starter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test tools
        run: python -m unittest discover -s tests -v
      - name: Check fictional example
        run: python scripts/cv.py check --input examples/cv.md
      - name: Rebuild fictional example
        run: python scripts/cv.py build --input examples/cv.md --output output/example --strict
      - name: Export a real PDF on Windows
        if: runner.os == 'Windows'
        run: python scripts/cv.py pdf --output output/example
      - name: Verify PDF signature on Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          import json
          output = Path("output/example")
          metadata = json.loads((output / "build.json").read_text())
          data = (output / metadata["pdf_filename"]).read_bytes()
          assert data.startswith(b"%PDF-") and b"%%EOF" in data[-2048:]
      - name: Install PDF extraction test dependency
        if: runner.os == 'Windows'
        run: python -m pip install "pypdf>=5,<6"
      - name: Verify real PDF text and reading order on Windows
        if: runner.os == 'Windows'
        env:
          CVKEEPER_PDF_TESTS: '1'
        run: python -m unittest discover -s tests -p test_pdf_integration.py -v
      - name: Package starter only
        run: python scripts/package.py
